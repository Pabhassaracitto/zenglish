name: zenglish
description: English for Wisdom & Meditation - App học tiếng Anh cho hệ thống Theravāda
publish_to: 'none'
version: 1.0.1-beta.1+2

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # ── Navigation ──
  go_router: ^13.2.0

  # ── Data / Serialization ──
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # ── Local Storage ──
  shared_preferences: ^2.2.2

  # ── UI / Fonts ──
  google_fonts: ^6.1.0

  # ── Utils ──
  http: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.3.3
  cloud_firestore: ^6.5.0
  just_audio: ^0.10.5

  # ── Lưu audio tải về máy (đã có sẵn trong lock dạng transitive) ──
  path_provider: ^2.1.5

  # ── Giọng đọc tổng hợp (fallback khi bài chưa có bản thu) ──
  # Dùng engine TTS của hệ điều hành. Có thể thay bằng engine offline
  # đóng gói kèm app (ví dụ Sherpa-onnx) qua SpeechSynthesizer interface.
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

  # Testing
  mocktail: ^1.0.0

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/data/lessons/
    # Audio bundle kèm app khi build: file nào có ở đây được phát trực tiếp,
    # không cần tải (xem lib/data/constants/audio_catalog.dart).
    - assets/audio/
  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
