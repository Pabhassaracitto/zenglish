name: Legacy manual platform builds

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android?'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS unsigned IPA?'
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows?'
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux?'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build-android:
    name: Build Android APK
    needs: quality
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mv \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/zenglish-Android-ARM64-${{ github.run_id }}-${{ github.run_attempt }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/zenglish-Android-ARM64-*.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows App
    needs: quality
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release\*"
          $destination = "$env:GITHUB_WORKSPACE\zenglish-Windows-${{ github.run_id }}-${{ github.run_attempt }}.zip"
          Compress-Archive -Path $source -DestinationPath $destination

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: zenglish-Windows-*.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS IPA (unsigned)
    needs: quality
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r \
            zenglish-iOS-unsigned-${{ github.run_id }}-${{ github.run_attempt }}.ipa \
            Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: zenglish-iOS-unsigned-*.ipa
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux App
    needs: quality
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux build
        working-directory: build/linux/x64/release/bundle
        run: |
          zip -r \
            "$GITHUB_WORKSPACE/zenglish-Linux-${{ github.run_id }}-${{ github.run_attempt }}.zip" \
            .

      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: zenglish-Linux-*.zip
          if-no-files-found: error
          retention-days: 14