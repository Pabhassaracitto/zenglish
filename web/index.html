  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO / Social -->

  <meta name="description" content="ZenGlish — Ứng dụng học tiếng Anh trong bối cảnh Phật giáo Theravāda, trí tuệ và thiền tập. Offline-first, 8 bài học, hỗ trợ Việt–Anh, audio &amp; TTS.">
  <meta name="keywords" content="ZenGlish, học tiếng Anh, Phật giáo, Theravada, thiền, meditation, Pali, CEFR, Flutter">
  <meta name="author" content="ZenGlish">

  <!-- Open Graph -->

  <meta property="og:description" content="Học tiếng Anh trong bối cảnh Theravāda. 8 bài học offline-first, hỗ trợ Việt–Anh, audio &amp; giọng tổng hợp.">

  <meta property="og:locale" content="vi_VN">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash / loading screen — màu kem ZenGlish */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FAF7F2;
      font-family: 'Merriweather', serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      color: #5C3D2E;
      transition: opacity 0.35s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .logo {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: #5C4A32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .app-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #2C1A0E;
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 2px solid #DDD0C0;
      border-top-color: #B8860B;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint {
      font-size: 11px;
      color: #AA9E8F;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <!-- Loading indicator — sẽ được Flutter thay thế khi sẵn sàng -->
  <div id="loading" aria-live="polite" aria-busy="true">
    <div class="logo" aria-hidden="true">☸️</div>
    <div class="app-name">ZenGlish<br>English for Wisdom &amp; Meditation</div>
    <div class="spinner" role="progressbar" aria-label="Đang tải"></div>
    <div class="hint">Đang khởi động…</div>
  </div>

  <script>
    // Ẩn splash khi Flutter first frame đã render
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function(){ el.remove(); }, 400);
      }
    });
    // Fallback: nếu 15s chưa có first-frame thì vẫn ẩn spinner (tránh kẹt)
    setTimeout(function(){
      var el = document.getElementById('loading');
      if (el && !el.classList.contains('hidden')) {
        var hint = el.querySelector('.hint');
        if (hint) hint.textContent = 'Vẫn đang tải… vui lòng kiểm tra kết nối';
      }
    }, 15000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
